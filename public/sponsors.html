    <meta name="description" content="Meet the sponsors supporting Spartan Flight's mission to build autonomous aerial systems and compete in the 2026 SUAS competition.">

    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="theme-color" content="#003366">
    <link rel="canonical" href="https://spartanflightsjsu.com/sponsors.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Our Sponsors - Spartan Flight">
    <meta property="og:description" content="Meet the sponsors supporting Spartan Flight's mission to build autonomous aerial systems and compete in the 2026 SUAS competition.">
    <meta property="og:url" content="https://spartanflightsjsu.com/sponsors.html">
    <meta property="og:image" content="https://spartanflightsjsu.com/images/sponsors-collage.png">

    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Our Sponsors - Spartan Flight">
    <meta name="twitter:description" content="Meet the sponsors supporting Spartan Flight's mission to build autonomous aerial systems and compete in the 2026 SUAS competition.">
    <meta name="twitter:image" content="https://spartanflightsjsu.com/images/sponsors-collage.png">
    <meta name="twitter:site" content="@spartan.flight">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <link rel="stylesheet" href="styles.min.css?v4">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"></noscript>
    <style>
        .sponsor-showcase {
            padding: 4rem 2rem;
        }

        .sponsor-cta {
            text-align: center;
            margin-bottom: 3rem;
        }

        .sponsor-tier {
            margin-bottom: 3.5rem;
        }

        .sponsor-tier h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-blue);
            font-size: 1.8rem;
            font-weight: 800;
        }

        .logos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 2rem;
            align-items: center;
            justify-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .logos-grid a {
            display: block;
            transition: transform 0.2s ease;
        }

        .logos-grid a:hover {
            transform: translateY(-2px);
        }

        .logos-grid img {
            height: 60px;
            max-width: 180px;
            width: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main id="main-content">
    <section class="page-header">
        <h1>Our Sponsors</h1>
        <p>The companies and individuals making this project possible.</p>
    </section>

    <section class="sponsor-showcase">
        <div class="section-container">
            <div class="sponsor-cta">
                <p style="font-size: 1.1rem; color: var(--text-light); margin-bottom: 1.5rem; max-width: 600px; margin-left: auto; margin-right: auto;">Want to join them? Check out what we offer sponsors and download our sponsorship packet.</p>
                <a href="sponsorship.html" class="btn btn-primary" style="font-size: 1rem; padding: 1rem 2.5rem;">Become a Sponsor</a>
            </div>

            <!-- Silver Tier Sponsors -->
            <div class="sponsor-tier">
                <h2>Silver Tier Sponsors</h2>
                <div class="logos-grid">
                    <div><img src="images/sponsor-alif.png" alt="Alif Semiconductor" loading="lazy" width="180" height="60"></div>
                </div>
            </div>

            <!-- Community Partners -->
            <div class="sponsor-tier">
                <h2>Community Partners</h2>
                <div class="logos-grid">
                    <div><picture>
                        <source srcset="images/sponsors-collage.avif" type="image/avif">
                        <source srcset="images/sponsors-collage.webp" type="image/webp">
                        <img src="images/sponsors-collage.png" alt="Community sponsor" loading="lazy" width="180" height="60">
                    </picture></div>
                    <div><picture>
                        <source srcset="images/sponsor_astral.avif" type="image/avif">
                        <source srcset="images/sponsor_astral.webp" type="image/webp">
                        <img src="images/sponsor_astral.png" alt="Astral" loading="lazy" width="180" height="60">
                    </picture></div>
                    <div><picture>
                        <source srcset="images/sponsor_stencilease.avif" type="image/avif">
                        <source srcset="images/sponsor_stencilease.webp" type="image/webp">
                        <img src="images/sponsor_stencilease.jpg" alt="Stencilease" loading="lazy" width="180" height="60">
                    </picture></div>
                </div>
            </div>
        </div>
    </section>

    </main>
    <div id="footer-placeholder"></div>
    <script src="load-header-footer.min.js?v4"></script>
</body>
</html>
